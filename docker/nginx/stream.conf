stream {
    server {
        listen 443 so_keepalive=on;
        
        # Forward traffic to the xray container
        proxy_pass xray:10443;
        
        # PROXY protocol is required so Xray knows the real client IP
        proxy_protocol on;
        
        proxy_timeout 1h;
        proxy_connect_timeout 10s;
        tcp_nodelay on;
    }
}
