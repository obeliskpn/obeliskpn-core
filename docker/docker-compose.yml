version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: obelisk_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/stream.conf:/etc/nginx/stream.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    restart: always
    depends_on:
      - xray

  xray:
    image: teddysun/xray:latest
    container_name: obelisk_xray
    volumes:
      - ./xray/config.json:/usr/local/etc/xray/config.json:ro
    restart: always
